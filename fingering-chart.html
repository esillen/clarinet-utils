<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fingering Chart</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="page">
    <nav class="top-nav">
      <a href="index.html">← Back to utilities</a>
    </nav>

    <header>
      <h1>Fingering Chart</h1>
      <p>Look up standard, alternate, and trill fingerings for written clarinet notes.</p>
    </header>

    <div id="fingering-chart-workspace" class="workspace">
      <section class="controls utility-panel">
        <label for="chart-search">Filter by note name</label>
        <input id="chart-search" type="search" placeholder="Example: G#3, Ab3, C4">
      </section>

      <section class="fingerings utility-panel">
        <h2>Fingerings</h2>
        <p id="chart-summary" class="muted"></p>
        <div id="chart-results" class="chart-results"></div>
      </section>
    </div>
  </main>

  <script src="js/music-core.js"></script>
  <script src="js/dev-mode.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/vexflow@4.2.3/build/cjs/vexflow.js"></script>
  <script src="js/vexflow-renderer.js"></script>
  <script src="js/wfg-alt-db.js"></script>
  <script src="js/fingering-db.js"></script>
  <script src="js/fingering-renderer.js"></script>
  <script src="js/fingering-chart.js"></script>
</body>
</html>
