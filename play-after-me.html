<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Play After Me</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="page">
    <nav class="top-nav">
      <a href="index.html">← Back to utilities</a>
    </nav>

    <header>
      <h1>Play After Me</h1>
      <p>The browser plays a clarinet phrase. Repeat it, then your notes are revealed on the staff.</p>
    </header>

    <div id="play-after-workspace" class="workspace">
      <section class="game-controls utility-panel">
      <p id="pam-current-tuning" class="status">Clarinet tuning: -</p>

      <div class="control-row">
        <label for="scale-select">Scale</label>
        <select id="scale-select">
          <option value="C_MAJOR">C Major</option>
          <option value="G_MAJOR">G Major</option>
          <option value="D_MAJOR">D Major</option>
          <option value="A_MAJOR">A Major</option>
          <option value="F_MAJOR">F Major</option>
          <option value="BB_MAJOR">B♭ Major</option>
          <option value="A_MINOR">A Minor</option>
          <option value="CHROMATIC">Chromatic</option>
        </select>
      </div>

      <div class="control-row">
        <label for="difficulty-select">Difficulty</label>
        <select id="difficulty-select">
          <option value="easy">Easy</option>
          <option value="medium">Medium</option>
          <option value="hard">Hard</option>
          <option value="custom">Custom</option>
        </select>
      </div>

      <div class="control-row">
        <label>Registers</label>
        <div class="register-options">
          <label for="pam-reg-chalumeau"><input id="pam-reg-chalumeau" type="checkbox" checked> Chalumeau</label>
          <label for="pam-reg-clarion"><input id="pam-reg-clarion" type="checkbox" checked> Clarion</label>
          <label for="pam-reg-altissimo"><input id="pam-reg-altissimo" type="checkbox" checked> Altissimo</label>
        </div>
      </div>

      <div class="control-row">
        <label for="reveal-first-note">Reveal first note</label>
        <input id="reveal-first-note" type="checkbox" checked>
      </div>

      <div id="custom-controls" class="custom-controls" hidden>
        <div class="control-row">
          <label for="custom-count">Notes per phrase</label>
          <input id="custom-count" type="number" min="3" max="16" value="6">
        </div>
        <div class="control-row">
          <label for="custom-min">Lowest note (written MIDI)</label>
          <input id="custom-min" type="number" min="55" max="96" value="67">
        </div>
        <div class="control-row">
          <label for="custom-max">Highest note (written MIDI)</label>
          <input id="custom-max" type="number" min="60" max="100" value="90">
        </div>
        <div class="control-row">
          <label for="custom-jump">Max jump (scale steps)</label>
          <input id="custom-jump" type="number" min="1" max="10" value="4">
        </div>
      </div>

      <div class="control-actions">
        <button id="start-game" type="button">Start game</button>
        <button id="stop-game" type="button" disabled>Stop</button>
      </div>

      <p id="game-status" class="status">Press Start game to begin.</p>
      </section>

      <section class="game-info utility-panel">
        <article class="game-card">
          <h2>Round</h2>
          <p id="round-number" class="big">0</p>
        </article>
        <article class="game-card">
          <h2>Last Speed</h2>
          <p id="round-speed" class="big">-</p>
        </article>
        <article class="game-card">
          <h2>Last Result</h2>
          <p id="round-result" class="big">-</p>
        </article>
      </section>

      <section class="score-panel utility-panel">
        <h2>Revealed Score</h2>
        <p class="muted">Notes are shown after your attempt.</p>
        <div id="score-output"></div>
        <p id="heard-notes" class="muted"></p>
      </section>
    </div>
  </main>

  <script src="js/music-core.js"></script>
  <script src="js/pitch-detector.js"></script>
  <script src="js/reorder-panels.js"></script>
  <script src="js/play-after-me.js"></script>
</body>
</html>
