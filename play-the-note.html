<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Play The Note</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="page">
    <nav class="top-nav">
      <a href="index.html">← Back to utilities</a>
    </nav>

    <header>
      <h1>Play The Note</h1>
      <p>A note appears on the staff. Play it as fast as possible, then the next note appears.</p>
    </header>

    <div id="play-note-workspace" class="workspace">
    <section class="game-controls utility-panel">
      <div class="control-row">
        <p id="ptn-current-tuning" class="status">Clarinet tuning: -</p>
      </div>

      <div class="control-row">
        <label for="ptn-scale">Scale</label>
        <select id="ptn-scale">
          <option value="C_MAJOR">C Major</option>
          <option value="G_MAJOR">G Major</option>
          <option value="D_MAJOR">D Major</option>
          <option value="A_MAJOR">A Major</option>
          <option value="F_MAJOR">F Major</option>
          <option value="BB_MAJOR">B♭ Major</option>
          <option value="A_MINOR">A Minor</option>
          <option value="CHROMATIC">Chromatic</option>
        </select>
      </div>

      <div class="control-row">
        <label>Registers</label>
        <div class="register-options">
          <label for="reg-chalumeau"><input id="reg-chalumeau" type="checkbox" checked> Chalumeau</label>
          <label for="reg-clarion"><input id="reg-clarion" type="checkbox" checked> Clarion</label>
          <label for="reg-altissimo"><input id="reg-altissimo" type="checkbox" checked> Altissimo</label>
        </div>
      </div>

      <div class="control-actions">
        <button id="ptn-retry" type="button" hidden>Start</button>
        <button id="ptn-stop" type="button" disabled>Stop</button>
      </div>

      <p id="ptn-status" class="status">Starting microphone...</p>
    </section>

    <section class="game-info utility-panel">
      <article class="game-card">
        <h2>Hits</h2>
        <p id="ptn-hits" class="big">0</p>
      </article>
      <article class="game-card">
        <h2>Notes / Minute</h2>
        <p id="ptn-npm" class="big">0.0</p>
      </article>
      <article class="game-card">
        <h2>Last Reaction</h2>
        <p id="ptn-reaction" class="big">-</p>
      </article>
    </section>

    <section class="score-panel utility-panel">
      <h2>Target Note</h2>
      <p class="muted">Play exactly this written note on your clarinet.</p>
      <div id="ptn-score"></div>
      <p id="ptn-note-label" class="muted"></p>
    </section>
    </div>
  </main>

  <script src="js/music-core.js"></script>
  <script src="js/staff-render.js"></script>
  <script src="js/scale-register-controls.js"></script>
  <script src="js/pitch-detector.js"></script>
  <script src="js/reorder-panels.js"></script>
  <script src="js/play-the-note.js"></script>
</body>
</html>
